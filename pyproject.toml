[project]
name = "fabric-notebook-kit"
version = "0.1.0"
description = "Parameters, clean exits and idempotent merges for Microsoft Fabric notebooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
keywords = ["microsoft-fabric", "notebooks", "pyspark", "delta", "data-engineering"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric_notebook_kit*"]
